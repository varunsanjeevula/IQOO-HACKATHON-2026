services:
  - type: web
    name: recall-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --workspace backend && npm run build --workspace backend
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: recall-web
          property: host
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: recall-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --workspace frontend && npm run build --workspace frontend
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: recall-api
          property: host